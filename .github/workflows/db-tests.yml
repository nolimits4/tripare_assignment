name: Database tests

# This is a test suite, not a backup job. It proves the migrations, seed data
# and the backup/restore scripts work on a clean checkout, using a throwaway
# database that is created and destroyed within the run.
#
# Real scheduled backups are infrastructure, not CI: see infra/modules/backup,
# which runs pg_dump against RDS every four hours via EventBridge Scheduler.
# A cron job here would only ever dump a database it had just created itself.
on:
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore:
    name: Migrate, seed, back up and restore
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # -x follows the `. lib/common.sh` sourcing so the library's
          # definitions are in scope. --severity=warning ignores style and
          # info notes, which would otherwise fail the run on cosmetics.
          shellcheck -x --severity=warning \
            scripts/*.sh scripts/lib/*.sh db/init/*.sh

      - name: Ensure the scripts are executable
        # Guards against the executable bit being lost when the repository is
        # committed from Windows.
        run: chmod +x scripts/*.sh scripts/lib/*.sh db/init/*.sh

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Show the bootstrap log
        if: always()
        run: docker compose logs postgres

      - name: Show the seeded dataset
        run: |
          docker compose exec -T postgres \
            psql -U hotelapp -d hotelapp -f /sql/queries/verify_data.sql

      - name: Benchmark the reporting query
        run: ./scripts/benchmark.sh

      - name: Back up
        run: ./scripts/backup.sh

      - name: Restore into a fresh database and verify
        run: ./scripts/restore.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
